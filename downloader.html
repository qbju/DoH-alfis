<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoH Profile Generator</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }
  input, button {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
  }
  button { cursor: pointer; }
  label { display:block; margin-top:18px; }
  #status { margin-top:15px; }
</style>
</head>
<body>
<h1>DoH Profile Generator</h1>

<label>
  プライマリ DoH Server URL
  <input id="primary" type="url" placeholder="https://example.com/dns-query"
         autocomplete="off" spellcheck="false">
</label>

<label>
  セカンダリ DoH Server URL
  <input id="secondary" type="url" placeholder="https://secondary.example.com/dns-query"
         autocomplete="off" spellcheck="false">
</label>

<div class="note">
  iOSのDNSSettings payloadではDoHのServerURLは1つです。
  このジェネレーターではプライマリ／セカンダリを同じ.mobileconfig内の2つのDNS payloadとして設定します。
  ただし、iOSがこれを優先順位付きの一次／二次フェイルオーバーとして扱う仕様ではありません。
</div>

<label>
  Profile Name
  <input id="name" type="text" placeholder="My DoH">
</label>

<button id="generate">構成プロファイルを生成</button>
<p id="status"></p>

<script>
function uuid() {
  return crypto.randomUUID().toUpperCase();
}

function escapeXML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

document.getElementById("generate").addEventListener("click", () => {
  const primary = document.getElementById("primary").value.trim();
  const secondary = document.getElementById("secondary").value.trim();
  const name = document.getElementById("name").value.trim() || "Custom DoH";

  function validateURL(value, label) {
    if (!value) throw new Error(label + "を入力してください");
    let parsed;
    try { parsed = new URL(value); }
    catch { throw new Error(label + "のURLが正しくありません"); }
    if (parsed.protocol !== "https:") throw new Error(label + "はHTTPS URLを指定してください");
    return value;
  }

  let primaryURL, secondaryURL;
  try {
    primaryURL = validateURL(primary, "プライマリ DoH URL");
    secondaryURL = validateURL(secondary, "セカンダリ DoH URL");
  } catch (err) {
    alert(err instanceof Error ? err.message : "URLを確認してください");
    return;
  }

  const profileUUID = uuid();
  const primaryUUID = uuid();
  const secondaryUUID = uuid();
  const safeName = escapeXML(name);

  function payload(url, displayName, identifier, payloadUUID) {
    return [
      "    <dict>",
      "      <key>DNSSettings</key>",
      "      <dict>",
      "        <key>DNSProtocol</key>",
      "        <string>HTTPS</string>",
      "        <key>ServerURL</key>",
      "        <string>" + escapeXML(url) + "</string>",
      "      </dict>",
      "      <key>PayloadDescription</key>",
      "      <string>DNS over HTTPS</string>",
      "      <key>PayloadDisplayName</key>",
      "      <string>" + escapeXML(displayName) + "</string>",
      "      <key>PayloadIdentifier</key>",
      "      <string>" + identifier + "</string>",
      "      <key>PayloadType</key>",
      "      <string>com.apple.dnsSettings.managed</string>",
      "      <key>PayloadUUID</key>",
      "      <string>" + payloadUUID + "</string>",
      "      <key>PayloadVersion</key>",
      "      <integer>1</integer>",
      "    </dict>"
    ].join("\n");
  }

  const profile = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
    "<plist version=\"1.0\">",
    "<dict>",
    "  <key>PayloadContent</key>",
    "  <array>",
    payload(primaryURL, name + " - Primary", "com.custom.doh.primary." + primaryUUID, primaryUUID),
    payload(secondaryURL, name + " - Secondary", "com.custom.doh.secondary." + secondaryUUID, secondaryUUID),
    "  </array>",
    "  <key>PayloadDescription</key>",
    "  <string>DNS over HTTPS configuration</string>",
    "  <key>PayloadDisplayName</key>",
    "  <string>" + safeName + "</string>",
    "  <key>PayloadIdentifier</key>",
    "  <string>com.custom.doh.profile." + profileUUID + "</string>",
    "  <key>PayloadOrganization</key>",
    "  <string>Custom DoH</string>",
    "  <key>PayloadRemovalDisallowed</key>",
    "  <false/>",
    "  <key>PayloadType</key>",
    "  <string>Configuration</string>",
    "  <key>PayloadUUID</key>",
    "  <string>" + profileUUID + "</string>",
    "  <key>PayloadVersion</key>",
    "  <integer>1</integer>",
    "</dict>",
    "</plist>"
  ].join("\n");

  const blob = new Blob([profile], { type: "application/x-apple-aspen-config" });
  const downloadURL = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = downloadURL;
  a.download = "custom-doh.mobileconfig";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(downloadURL), 60000);
  document.getElementById("status").textContent = "プライマリ／セカンダリの構成プロファイルを生成しました。";
});
</script>
</body>
</html>
